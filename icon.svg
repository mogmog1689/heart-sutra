<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション（深みのある漆黒・寺院ネイビー） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2029"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <!-- 金色グラデーション（品格ある本金・山吹色） -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d4"/>
      <stop offset="35%" stop-color="#dfb841"/>
      <stop offset="100%" stop-color="#997818"/>
    </linearGradient>
    <!-- 枠線グラデーション -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb841"/>
      <stop offset="100%" stop-color="#5c470e"/>
    </linearGradient>
  </defs>

  <!-- 背景プレート（角丸は外枠用、マスクされても安全） -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- 金の円相（セーフゾーン内に収まる半径162px、直径324px） -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-dasharray="820 110" transform="rotate(-30 256 256)" opacity="0.8"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.35"/>

  <!-- 「般若心経」4文字（中央にギュッと寄せてセーフゾーン内に完全に収める） -->
  <g font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'BIZ UDPMincho', 'MS Mincho', serif" font-weight="900" fill="url(#goldGrad)" font-size="96" text-anchor="middle" dominant-baseline="central">
    <!-- 上段：般 若 (y = 205) -->
    <text x="198" y="205">般</text>
    <text x="314" y="205">若</text>

    <!-- 下段：心 経 (y = 308) -->
    <text x="198" y="308">心</text>
    <text x="314" y="308">経</text>
  </g>

  <!-- 中央下の蓮花アクセント飾り（セーフゾーン内 y=362） -->
  <path d="M190 365 C222 384, 290 384, 322 365" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <circle cx="256" cy="374" r="3.5" fill="url(#goldGrad)" opacity="0.75"/>
</svg>
