<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f26"/>
      <stop offset="100%" stop-color="#0c0d10"/>
    </linearGradient>
    <!-- 金色グラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faecc5"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <!-- 朱色アクセント -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b6b"/>
      <stop offset="100%" stop-color="#d93829"/>
    </linearGradient>
  </defs>

  <!-- 背景プレート -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>

  <!-- 円相（Zen Circle） -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="900 120" transform="rotate(-40 256 256)" opacity="0.85"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.25"/>

  <!-- 朱の落款・印鑑風モチーフ（右下） -->
  <rect x="330" y="330" width="64" height="64" rx="14" fill="url(#redGrad)" opacity="0.9"/>
  <text x="362" y="372" font-family="'Yu Mincho', serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">経</text>

  <!-- 中央の「心」文字（荘厳な楷書・明朝風デザイン） -->
  <text x="256" y="325" font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'BIZ UDPMincho', serif" font-size="210" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">心</text>

  <!-- 蓮の台座の装飾ライン -->
  <path d="M190 390 C220 415, 292 415, 322 390" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
</svg>
