<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 背景グラデーション（漆黒・深紺） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1d24"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <!-- 金色グラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1cf"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7a1a"/>
    </linearGradient>
    <!-- 金枠用 -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6e5714"/>
    </linearGradient>
  </defs>

  <!-- 背景プレート -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="10" y="10" rx="105" fill="none" stroke="url(#goldBorder)" stroke-width="4" opacity="0.5"/>

  <!-- 金の円相（Zen Enso Circle） -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="1000 130" transform="rotate(-35 256 256)" opacity="0.75"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.3"/>

  <!-- 「般若心経」4文字（2行2列の格式高い配置） -->
  <g font-family="'Yu Mincho', 'Hiragino Mincho ProN', 'BIZ UDPMincho', serif" font-weight="900" fill="url(#goldGrad)">
    <!-- 上段：般 若 -->
    <text x="180" y="215" font-size="125" text-anchor="middle" letter-spacing="1">般</text>
    <text x="332" y="215" font-size="125" text-anchor="middle" letter-spacing="1">若</text>

    <!-- 下段：心 経 -->
    <text x="180" y="360" font-size="125" text-anchor="middle" letter-spacing="1">心</text>
    <text x="332" y="360" font-size="125" text-anchor="middle" letter-spacing="1">経</text>
  </g>

  <!-- 装飾：蓮の台座アクセント -->
  <path d="M160 405 C210 432, 302 432, 352 405" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <circle cx="256" cy="418" r="4" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
